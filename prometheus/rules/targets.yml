groups:
  - name: targets
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus could not scrape {{ $labels.instance }} for 2 minutes."

      - alert: ContainerRestarting
        expr: increase(container_start_time_seconds{name!=""}[15m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} is restarting"
          description: "{{ $labels.name }} restarted {{ $value }} times in 15 minutes."

      - alert: ContainerHighMemory
        expr: |
          (container_memory_working_set_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} > 0.9)
          and container_spec_memory_limit_bytes{name!=""} > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} near memory limit"
          description: "Working set is {{ $value | humanizePercentage }} of its limit."

      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Alerting pipeline heartbeat"
          description: "Always firing. Route to a dead-man's-switch service to detect a broken alert pipeline."
