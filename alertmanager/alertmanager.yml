# Alertmanager config. The Telegram token is NOT stored here: entrypoint.sh writes it
# from $TELEGRAM_BOT_TOKEN into a file read via bot_token_file, and substitutes the chat id.
global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [alertname = "Watchdog"]
      receiver: blackhole
    - matchers: [severity = "critical"]
      receiver: telegram
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: [alertname, instance]

receivers:
  - name: blackhole
  - name: telegram
    telegram_configs:
      - bot_token_file: /tmp/telegram_token
        chat_id: __TELEGRAM_CHAT_ID__
        parse_mode: HTML
        send_resolved: true
        message: '{{ template "telegram.message" . }}'
