rule_files:
  - ../prometheus/rules/host.yml
  - ../prometheus/rules/targets.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="host"}'
        values: "5x10"
      - series: 'node_memory_MemTotal_bytes{instance="host"}'
        values: "100x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: HostHighMemory
        exp_alerts:
          - exp_labels: { severity: warning, instance: host }
            exp_annotations:
              summary: "High memory usage on host"
              description: "Memory utilisation is 95%."

  - interval: 1m
    input_series:
      - series: 'up{job="api", instance="api:8000"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 5m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: { severity: critical, job: api, instance: "api:8000" }
            exp_annotations:
              summary: "api target api:8000 is down"
              description: "Prometheus could not scrape api:8000 for 2 minutes."

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="host", mountpoint="/", fstype="ext4"}'
        values: "5x10"
      - series: 'node_filesystem_size_bytes{instance="host", mountpoint="/", fstype="ext4"}'
        values: "100x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: HostDiskAlmostFull
        exp_alerts:
          - exp_labels: { severity: critical, instance: host, mountpoint: "/", fstype: ext4 }
            exp_annotations:
              summary: "Disk / almost full on host"
              description: "5% space left."
